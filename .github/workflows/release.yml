name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux Glibc x86
          - name: Linux x86
            os: ubuntu-latest
            target: x86_64
            manylinux: auto

          # Musl x86
          - name: Musl x86
            os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2

          # Linux Glibc ARM64
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64
            manylinux: auto

          # MacOS (Universal / x86 + ARM)
          - name: MacOS
            os: macos-latest
            target: x86_64
            manylinux: auto 

          # Windows
          - name: Windows
            os: windows-latest
            target: x64
            manylinux: auto 

    steps:
      - uses: actions/checkout@v6
      
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
      
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}