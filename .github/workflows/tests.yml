name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  ## -- Linux, Windows, MacOS 
  test-standard:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        run: rustup update stable && rustup default stable
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: pip install maturin pytest

      - name: Build and Test
        run: |
          maturin develop --release
          pytest tests

  ## -- Alpine (Musl) 
  test-alpine:
    name: Test (Alpine/Musl)
    runs-on: ubuntu-latest
    container:
      image: python:3.13-alpine # Python on Alpine comes with Musl
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Alpine build deps
        run: apk add --no-cache gcc musl-dev libffi-dev rust cargo openssl-dev git

      - name: Install dependencies
        run: pip install maturin pytest

      - name: Build and Test
        run: |
          maturin develop --release
          pytest tests

  ## -- FreeBSD 
  test-freebsd:
    name: Test (FreeBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # Install Rust, Python, and git inside the VM
          prepare: pkg install -y rust python3 py311-pip git
          run: |
            # Create a venv because FreeBSD system python is protected
            python3 -m venv venv
            . venv/bin/activate
            
            pip install maturin pytest
            maturin develop --release
            pytest tests